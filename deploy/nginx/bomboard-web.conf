# BOMBoard web deployment for a Vite static dist directory.
# Copy apps/web/dist to the root below, then include this file from nginx.conf.

server {
    listen 80;
    server_name _;

    root /var/www/bomboard/dist;
    index index.html;

    etag on;
    if_modified_since exact;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # Vite emits content-hashed files under /assets. These can be cached
    # aggressively because a new build references new file names from index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The manifest is small and carries the footprint library revision.
    # Revalidate it so a deployment can point browsers at new versioned chunks.
    location = /footprints/manifest.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Footprint chunks are large. The app requests them with ?v=<manifest.revision>,
    # so a library update changes the URL and browsers fetch the new child files.
    location /footprints/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The app shell must always be revalidated. This is what lets browsers
    # discover a freshly deployed build and pull the new hashed assets.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # SPA fallback. Keep fallback responses revalidated so deployments are
    # visible without users clearing browser cache.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
