name: Release

on:
  push:
    tags:
      - "v*"
      - "*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0-beta.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.25.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_REF_NAME: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  web-dist:
    name: Web dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Resolve release version
        shell: bash
        run: |
          version="${RELEASE_REF_NAME#v}"
          echo "BOMBOARD_VERSION=$version" >> "$GITHUB_ENV"
          echo "VITE_BOMBOARD_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        run: pnpm release:version

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm --filter @bomboard/web build

      - name: Package web dist
        shell: bash
        run: |
          cd apps/web/dist
          zip -r "../../../BOMBoard-web-dist-${BOMBOARD_VERSION}.zip" .

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: BOMBoard-web-dist-*.zip
          if-no-files-found: error

  electron-windows:
    name: Electron Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Resolve release version
        shell: bash
        run: |
          version="${RELEASE_REF_NAME#v}"
          echo "BOMBOARD_VERSION=$version" >> "$GITHUB_ENV"
          echo "VITE_BOMBOARD_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        run: pnpm release:version

      - name: Build web
        run: pnpm --filter @bomboard/web build

      - name: Build Electron app
        run: pnpm --filter @bomboard/desktop-electron build

      - name: Package Electron Windows artifacts
        run: pnpm --filter @bomboard/desktop-electron dist:win

      - uses: actions/upload-artifact@v7
        with:
          name: electron-windows
          path: apps/desktop-electron/release/*
          if-no-files-found: error

  tauri-windows:
    name: Tauri Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve release version
        shell: bash
        run: |
          version="${RELEASE_REF_NAME#v}"
          echo "BOMBOARD_VERSION=$version" >> "$GITHUB_ENV"
          echo "VITE_BOMBOARD_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        run: pnpm release:version

      - name: Package Tauri Windows installer
        run: pnpm --filter @bomboard/desktop-tauri build:win

      - name: Rename Tauri installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem "apps/desktop-tauri/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $setup) {
            throw "Tauri NSIS installer was not found."
          }
          Copy-Item $setup.FullName "BOMBoard-tauri-setup-$env:BOMBOARD_VERSION-x64.exe"

      - name: Package Tauri portable zip
        shell: pwsh
        run: |
          $portableDir = "apps/desktop-tauri/src-tauri/target/release/portable"
          $releaseDir = "apps/desktop-tauri/src-tauri/target/release"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "$releaseDir/bomboard.exe" "$portableDir/BOMBoard.exe"
          Get-ChildItem $releaseDir -Filter "*.dll" | Copy-Item -Destination $portableDir
          Compress-Archive -Force -Path "$portableDir/*" -DestinationPath "BOMBoard-tauri-portable-$env:BOMBOARD_VERSION-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: tauri-windows
          path: |
            BOMBoard-tauri-setup-*.exe
            BOMBoard-tauri-portable-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - web-dist
      - electron-windows
      - tauri-windows
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -maxdepth 2 -type f -print

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_REF_NAME }}
          files: release-assets/*
          generate_release_notes: true
